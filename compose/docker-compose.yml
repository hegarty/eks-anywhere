version: "3.9"

services:
  eksa-bootstrap:
    image: public.ecr.aws/eks-anywhere/eks-a-tools:latest
    container_name: eksa-bootstrap
    privileged: true
    environment:
      - CLUSTER_NAME=dev-cluster
      - PROVIDER=docker
    volumes:
      - ../eksa:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: |
      eksctl anywhere create cluster -f cluster.yaml && tail -f /dev/null
    networks:
      - eksa-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - eksa-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana:/etc/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - eksa-net

networks:
  eksa-net:
    driver: bridge
